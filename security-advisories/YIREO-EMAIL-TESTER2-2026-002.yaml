summary: 'Customer password reset tokens exposed to restricted admin users via email preview and send'
details: |-
  ### Impact
  The customer email variable used `CustomerRegistry::retrieveSecureData()`, which contains the decrypted password reset token (`rp_token`) and the password hash of a customer. An admin user who only has access to Yireo EmailTester could preview or send a template like `customer_password_forgot_email_template` for any customer with a pending reset token, obtain a working password reset link and take over the customer account. Custom database templates could also output `password_hash`.

  In addition, the sender of test emails was not restricted, so real customer and order data could be sent from arbitrary addresses through the shop mail infrastructure.

  ### Patches
  Fixed in 1.8.4:
  - A dummy reset token is used and secure customer data is no longer passed to templates
  - New ACL resources `Yireo_EmailTester2::preview` and `Yireo_EmailTester2::send` (grant them to restricted roles after upgrading)
  - The sender must be one of the configured store email identities or the configured default sender; every send is logged to `var/log/yireo_emailtester2.log`
  - Templates and store views are validated, the preview no longer writes to the session, and errors are logged instead of displayed

  ### Workarounds
  Remove the `Yireo_EmailTester2::index` resource from all admin roles that should not be able to read customer data, or disable the module.
